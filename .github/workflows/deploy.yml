name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Demangle branch name
        id: branch
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          # Replace slashes, spaces, and other special characters with dashes
          DEMANGLED=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "demangled=$DEMANGLED" >> $GITHUB_OUTPUT

          if [ "$BRANCH_NAME" = "main" ]; then
            echo "base_path=/sl-dashboard/" >> $GITHUB_OUTPUT
            echo "target_folder=." >> $GITHUB_OUTPUT
          else
            echo "base_path=/sl-dashboard/branches/$DEMANGLED/" >> $GITHUB_OUTPUT
            echo "target_folder=branches/$DEMANGLED" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
        env:
          VITE_BASE_PATH: ${{ steps.branch.outputs.base_path }}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: ${{ steps.branch.outputs.target_folder }}
          clean: true
          clean-exclude: |
            branches/**
